<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Panameño Garcia'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --sb-width: 260px; --sb-mini: 80px; --top-height: 70px; --primary: #2563eb; --dark-bg: #0f172a; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; display: flex; min-height: 100vh; }
        
        /* Sidebar Personalizado */
        #sidebar { width: var(--sb-width); background: var(--dark-bg); height: 100vh; position: fixed; transition: all 0.3s ease; z-index: 1100; display: flex; flex-direction: column; }
        #sidebar.mini { width: var(--sb-mini); }
        .sidebar-toggle-area { height: var(--top-height); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        #toggleMenu { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
        #toggleMenu:hover { color: white; }
        .nav-wrapper { flex-grow: 1; padding: 20px 0; }
        .nav-link { color: #94a3b8; padding: 12px 25px; display: flex; align-items: center; text-decoration: none; transition: 0.2s; white-space: nowrap; }
        .nav-link i { font-size: 1.3rem; min-width: 30px; margin-right: 15px; }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-link.active { color: white; background: var(--primary); border-radius: 0 50px 50px 0; margin-right: 15px; }
        #sidebar.mini .nav-text { display: none; }
        #sidebar.mini .nav-link i { margin-right: 0; }
        #sidebar.mini .nav-link { justify-content: center; padding: 12px 0; }
        
        /* Contenido Principal */
        #main-content { flex-grow: 1; margin-left: var(--sb-width); transition: all 0.3s ease; display: flex; flex-direction: column; width: calc(100% - var(--sb-width)); }
        #main-content.expanded { margin-left: var(--sb-mini); width: calc(100% - var(--sb-mini)); }
        
        /* Topbar Personalizado */
        #topbar { height: var(--top-height); background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: sticky; top: 0; z-index: 1000; }
        .brand-name { font-weight: 800; color: var(--dark-bg); font-size: 1.25rem; }
        .profile-pill { background: #f1f5f9; padding: 6px 16px; border-radius: 50px; display: flex; align-items: center; cursor: pointer; }
        .content-body { padding: 30px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .stat-box { border-radius: 12px; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>
    
    <!-- FRAGMENTO SIDEBAR CON RBAC ESTRICTO -->
    <aside th:fragment="sidebar(activePage)" id="sidebar">
        <div class="sidebar-toggle-area"><button id="toggleMenu"><i class="bi bi-list"></i></button></div>
        <div class="nav-wrapper">
            <nav class="nav flex-column">
                <a class="nav-link" th:classappend="${activePage == 'home' ? 'active' : ''}" href="/dashboard"><i class="bi bi-house"></i> <span class="nav-text">Inicio</span></a>
                
                <!-- Solo Admin -->
                <div sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" th:classappend="${activePage == 'usuarios' ? 'active' : ''}" href="/usuarios"><i class="bi bi-shield-lock"></i> <span class="nav-text">Usuarios</span></a></div>
                
                <!-- Admin y Jefe -->
                <div sec:authorize="hasAnyRole('ADMINISTRADOR','JEFE')"><a class="nav-link" th:classappend="${activePage == 'clientes' ? 'active' : ''}" href="/clientes"><i class="bi bi-person-vcard"></i> <span class="nav-text">Clientes</span></a></div>
                <div sec:authorize="hasAnyRole('ADMINISTRADOR','JEFE')"><a class="nav-link" th:classappend="${activePage == 'proyectos' ? 'active' : ''}" href="/proyectos"><i class="bi bi-buildings"></i> <span class="nav-text">Proyectos</span></a></div>
                <div sec:authorize="hasAnyRole('ADMINISTRADOR','JEFE')"><a class="nav-link" th:classappend="${activePage == 'cotizaciones' ? 'active' : ''}" href="/cotizaciones"><i class="bi bi-file-earmark-text"></i> <span class="nav-text">Cotizaciones</span></a></div>
                <div sec:authorize="hasAnyRole('ADMINISTRADOR','JEFE','SUPERVISOR')"><a class="nav-link" th:classappend="${activePage == 'inventario' ? 'active' : ''}" href="/inventario"><i class="bi bi-tools"></i> <span class="nav-text">Inventario</span></a></div>

                <!-- Solo Supervisor -->
                <div sec:authorize="hasRole('SUPERVISOR')"><a class="nav-link" th:classappend="${activePage == 'trabajadores' ? 'active' : ''}" href="/trabajadores"><i class="bi bi-people"></i> <span class="nav-text">Trabajadores</span></a></div>
                
                <!-- Supervisor, Jefe y Contadora -->
                <div sec:authorize="hasAnyRole('SUPERVISOR','JEFE','CONTADORA')"><a class="nav-link" th:classappend="${activePage == 'asistencias' ? 'active' : ''}" href="/asistencias"><i class="bi bi-calendar-check"></i> <span class="nav-text">Asistencias</span></a></div>
                <div sec:authorize="hasAnyRole('SUPERVISOR','JEFE','CONTADORA')"><a class="nav-link" th:classappend="${activePage == 'facturas' ? 'active' : ''}" href="/facturas"><i class="bi bi-receipt"></i> <span class="nav-text">Facturas/Gastos</span></a></div>
                
                <!--<div sec:authorize="hasRole('ADMINISTRADOR', 'JEFE')"><a class="nav-link" th:classappend="${activePage == 'auditoria' ? 'active' : ''}" href="/auditoria"><i class="bi bi-clock-history"></i> <span class="nav-text">Auditoría</span></a></div>
            --><div sec:authorize="hasAnyRole('ADMINISTRADOR', 'JEFE')"><a class="nav-link" th:classappend="${activePage == 'auditoria' ? 'active' : ''}" href="/auditoria"><i class="bi bi-clock-history"></i> <span class="nav-text">Auditoría</span></a></div>
                <!-- Solo Contadora -->
                <div sec:authorize="hasRole('CONTADORA')"><a class="nav-link" th:classappend="${activePage == 'planillas' ? 'active' : ''}" href="/planillas"><i class="bi bi-cash-coin"></i> <span class="nav-text">Planillas</span></a></div>
                <div sec:authorize="hasRole('CONTADORA')"><a class="nav-link" th:classappend="${activePage == 'facturacion' ? 'active' : ''}" href="/facturacion/historial"><i class="bi bi-filetype-xml"></i> <span class="nav-text">Exportar Llama</span></a></div>
                
                <!-- Admin, Jefe y Contadora -->
                 
                <div class="p-3 border-top border-secondary mt-auto">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-danger w-100 rounded-pill btn-sm fw-bold">
                            <i class="bi bi-box-arrow-right me-2"></i>Salir del Sistema
                        </button>
                    </form>
                </div>
                        
            </nav>
        </div>
    </aside>

    <!-- FRAGMENTO TOPBAR CON BREADCRUMBS Y BOTÓN ATRÁS -->
    <header th:fragment="topbar(pageName)" id="topbar">
        <div class="d-flex align-items-center">
            <div class="brand-name me-4 pe-4 border-end"><i class="bi bi-hexagon-fill text-primary me-2"></i>PG SISTEMA</div>
            
            <div class="d-flex align-items-center gap-3">
                
                <!-- BOTÓN ATRÁS (Oculto si estamos en el Dashboard) -->
                <button th:if="${pageName != 'Panel de Control'}" 
                        onclick="if(document.referrer) history.back(); else window.location.href='/dashboard';" 
                        class="btn btn-sm btn-white border shadow-sm rounded-pill px-3 fw-bold text-secondary" style="font-size: 0.75rem;">
                    <i class="bi bi-arrow-left me-1"></i> Atrás
                </button>
                
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0 fw-semibold" id="auto-breadcrumb" style="font-size: 0.95rem;">
                        <li class="breadcrumb-item">
                            <a href="/dashboard" class="text-decoration-none text-muted"><i class="bi bi-house-door-fill"></i> Inicio</a>
                        </li>
                        <!-- Si NO estamos en el Dashboard, mostramos la ruta actual -->
                        <li th:if="${pageName != 'Panel de Control'}" class="breadcrumb-item active text-primary" aria-current="page" th:text="${pageName}"></li>
                    </ol>
                </nav>
            </div>
        </div>
        
        <div class="dropdown">
            <div class="profile-pill dropdown-toggle" data-bs-toggle="dropdown">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold me-2" style="width: 32px; height: 32px;"><span th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}"></span></div>
                <span class="text-dark fw-bold d-none d-sm-inline" th:text="${#authentication.name}"></span>
            </div>
            <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-2 p-2">
                <li><form th:action="@{/logout}" method="post"><button type="submit" class="dropdown-item text-danger fw-bold rounded-2"><i class="bi bi-power me-2"></i>Cerrar Sesión</button></form></li>
            </ul>
        </div>
    </header>

    <!-- FRAGMENTO SCRIPTS -->
    <script th:fragment="script">
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Sidebar Original
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            const toggle = document.getElementById('toggleMenu');
            if(toggle){
                toggle.addEventListener('click', () => {
                    sidebar.classList.toggle('mini');
                    main.classList.toggle('expanded');
                    localStorage.setItem('sidebarMini', sidebar.classList.contains('mini'));
                });
            }
            if (localStorage.getItem('sidebarMini') === 'true') {
                sidebar.classList.add('mini');
                main.classList.add('expanded');
            }

            // 2. Breadcrumbs Dinámicos
            const pathArray = window.location.pathname.split('/').filter(x => x);
            if (pathArray.length > 0 && pathArray[0] !== 'error' && pathArray[0] !== 'dashboard') {
                const parentPath = pathArray[0];
                const parentName = parentPath.charAt(0).toUpperCase() + parentPath.slice(1).replace(/-/g, ' '); 
                const parentUrl = '/' + parentPath;
                const breadcrumbList = document.getElementById('auto-breadcrumb');
                
                if (breadcrumbList) {
                    const currentItem = document.querySelector('.breadcrumb-item.active');
                    const currentTitle = currentItem ? currentItem.innerText.toLowerCase() : '';
                    
                    if (currentTitle !== parentName.toLowerCase()) {
                        const newLi = document.createElement('li');
                        newLi.className = 'breadcrumb-item';
                        newLi.innerHTML = `<a href="${parentUrl}" class="text-decoration-none text-muted">${parentName}</a>`;
                        breadcrumbList.insertBefore(newLi, breadcrumbList.lastElementChild);
                    }
                }
            }

            // 3. Ocultar Alertas
            setTimeout(() => {
                document.querySelectorAll('.alert').forEach(alert => {
                    alert.style.transition = "opacity 0.5s ease"; 
                    alert.style.opacity = "0"; 
                    setTimeout(() => alert.remove(), 500); 
                });
            }, 5000);

            // ==========================================================
            // 4. ANTI-BACK DEL NAVEGADOR (Solo para el Dashboard y Login)
            // ==========================================================
            // Si el usuario está en el Panel Principal (Dashboard), sobreescribimos
            // su historial. Si intenta dar clic en "<-" (Atrás) en Chrome, 
            // el navegador lo mantendrá atrapado en esta misma página en lugar de 
            // llevarlo al Login o lanzar el Error 405.
            if (window.location.pathname === '/dashboard' || window.location.pathname === '/login') {
                history.pushState(null, null, window.location.href);
                window.onpopstate = function () {
                    history.go(1);
                };
            }
        });
    </script>
</body>
</html>
