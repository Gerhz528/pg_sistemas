<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportar Jornada - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Registrar Asistencia</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/asistencias/guardar}" th:object="${asistencia}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Trabajador</label>
                                <!-- Cambiado de *{trabajador} a *{trabajador.id} para asegurar el mapeo -->
                                <select th:field="*{trabajador.id}" class="form-select" required>
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="t : ${trabajadores}" 
                                            th:value="${t.id}" 
                                            th:text="${t.nombre}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fecha</label>
                                <input type="date" th:field="*{fecha}" class="form-control" required>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <label class="form-label">Entrada</label>
                                    <input type="time" th:field="*{horaEntrada}" class="form-control" required>
                                </div>
                                <div class="col">
                                    <label class="form-label">Salida</label>
                                    <input type="time" th:field="*{horaSalida}" class="form-control" required>
                                </div>
                            </div>
                            <div class="mt-4 text-end">
                                <a href="/asistencias" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar Registro</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
