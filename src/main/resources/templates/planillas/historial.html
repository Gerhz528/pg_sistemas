<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historial de Planillas')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('planillas')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Historial de Pagos')}"></header>
        <main class="content-body">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Planillas Cerradas</h4>
                <a href="/planillas" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                    <i class="bi bi-calculator me-2"></i>Calcular Nueva Planilla
                </a>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden bg-white">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Folio (ID)</th>
                                <th>Período de Pago</th>
                                <th>Generada el</th>
                                <th class="text-end">Total Pagado</th>
                                <th class="text-center pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${planillasGuardadas}">
                                <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${p.id}"></td>
                                <td>
                                    Del <span class="fw-bold text-dark" th:text="${#temporals.format(p.fechaInicio, 'dd/MM/yyyy')}"></span> 
                                    al <span class="fw-bold text-dark" th:text="${#temporals.format(p.fechaFin, 'dd/MM/yyyy')}"></span>
                                </td>
                                <td th:text="${#temporals.format(p.fechaGeneracion, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="text-end fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(p.totalPagar, 1, 2)}"></td>
                                <td class="text-center pe-4">
                                    <a th:href="@{/planillas/historial/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-4 fw-bold shadow-sm">
                                        <i class="bi bi-eye-fill me-1"></i>Ver Detalles
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(planillasGuardadas)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="bi bi-archive display-4 d-block mb-3 opacity-50"></i>
                                    Aún no hay planillas cerradas en el historial.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
