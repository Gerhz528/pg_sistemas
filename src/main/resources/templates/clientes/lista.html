<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Directorio de Clientes')}"></header>
        <main class="content-body">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4" th:text="${error}"></div>

            <!-- CONTROLES SUPERIORES Y BUSCADOR -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <form action="/clientes" method="get" class="flex-grow-1" style="max-width: 500px;">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border">
                        <span class="input-group-text bg-white border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="q" th:value="${q}" class="form-control border-0 bg-white shadow-none" placeholder="Buscar por nombre o DUI...">
                        <a th:if="${q != null and q != ''}" href="/clientes" class="btn btn-white border-0 text-danger d-flex align-items-center" title="Limpiar búsqueda"><i class="bi bi-x-circle-fill"></i></a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Buscar</button>
                    </div>
                </form>

                <button class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCrearCliente">
                    <i class="bi bi-person-plus-fill me-2"></i>Registrar Cliente
                </button>
            </div>
            
            <div class="card border-0 shadow-sm overflow-hidden bg-white">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre del Cliente</th>
                                <th>DUI</th>
                                <th>Teléfono</th>
                                <th>Correo Electrónico</th>
                                <th class="text-center pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${clientes}">
                                <td class="ps-4 fw-bold text-dark" th:text="${c.nombre}"></td>
                                <td th:text="${c.dui}" class="text-muted font-monospace small"></td>
                                <td><i class="bi bi-telephone text-primary me-2"></i><span th:text="${c.telefono}"></span></td>
                                <td th:text="${c.email != '' ? c.email : 'N/A'}" class="text-muted"></td>
                                <td class="text-center pe-4">
                                    <button class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold" data-bs-toggle="modal" th:data-bs-target="'#modalEditarCliente-' + ${c.id}">
                                        Editar
                                    </button>

                                    <!-- Modal Editar Cliente -->
                                    <div class="modal fade text-start" th:id="'modalEditarCliente-' + ${c.id}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content border-0 shadow">
                                                <form th:action="@{/clientes/guardar}" method="post">
                                                    <input type="hidden" name="id" th:value="${c.id}">
                                                    <div class="modal-header bg-warning border-0">
                                                        <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Datos del Cliente</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body p-4">
                                                        <div class="mb-3">
                                                            <label class="form-label fw-bold small text-muted">Nombre Completo / Empresa</label>
                                                            <input type="text" name="nombre" class="form-control bg-light border-0 fw-bold" th:value="${c.nombre}" required>
                                                        </div>
                                                        <div class="row g-3 mb-3">
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">DUI (Fijo)</label>
                                                                <input type="text" name="dui" class="form-control bg-white border-0 text-muted" th:value="${c.dui}" readonly>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">Teléfono</label>
                                                                <input type="text" name="telefono" class="form-control bg-light border-0" th:value="${c.telefono}" required>
                                                            </div>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label fw-bold small text-muted">Correo Electrónico</label>
                                                            <input type="email" name="email" class="form-control bg-light border-0" th:value="${c.email}">
                                                        </div>
                                                        <div class="mb-2">
                                                            <label class="form-label fw-bold small text-muted">Dirección</label>
                                                            <textarea name="direccion" class="form-control bg-light border-0" rows="2" th:text="${c.direccion}"></textarea>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer border-0 bg-light">
                                                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                                                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Actualizar</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="bi bi-briefcase display-6 d-block mb-2"></i>
                                    <span th:if="${q == null}">Aún no hay clientes registrados en el sistema.</span>
                                    <span th:if="${q != null}">No se encontraron resultados para "<span th:text="${q}"></span>"</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Crear Cliente -->
            <div class="modal fade" id="modalCrearCliente" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0 shadow">
                        <form th:action="@{/clientes/guardar}" th:object="${nuevoCliente}" method="post">
                            <div class="modal-header bg-success text-white border-0">
                                <h5 class="modal-title fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Registrar Nuevo Cliente</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-muted">Nombre Completo / Empresa</label>
                                    <input type="text" th:field="*{nombre}" class="form-control bg-light border-0" required>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">DUI (00000000-0)</label>
                                        <input type="text" th:field="*{dui}" class="form-control bg-light border-0 dui-format" placeholder="00000000-0" required pattern="\d{8}-\d" maxlength="10">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Teléfono</label>
                                        <input type="text" th:field="*{telefono}" class="form-control bg-light border-0" placeholder="Ej: 7000-0000" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-muted">Correo Electrónico (Opcional)</label>
                                    <input type="email" th:field="*{email}" class="form-control bg-light border-0" placeholder="cliente@correo.com">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label fw-bold small text-muted">Dirección (Opcional)</label>
                                    <textarea th:field="*{direccion}" class="form-control bg-light border-0" rows="2"></textarea>
                                </div>
                            </div>
                            <div class="modal-footer border-0 bg-light">
                                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">Guardar Cliente</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>
    
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SCRIPT DE AUTO-FORMATO DEL DUI -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const duiInputs = document.querySelectorAll('.dui-format');
            duiInputs.forEach(input => {
                input.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    if (value.length > 9) value = value.slice(0, 9);
                    if (value.length > 8) value = value.slice(0, 8) + '-' + value.slice(8);
                    e.target.value = value;
                });
            });
        });
    </script>
</body>
</html>
