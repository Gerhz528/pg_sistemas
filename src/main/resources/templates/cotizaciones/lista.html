<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cotizaciones')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('cotizaciones')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Gestión de Cotizaciones')}"></header>
        <main class="content-body">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4" th:text="${error}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <form action="/cotizaciones" method="get" class="flex-grow-1" style="max-width: 500px;">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border">
                        <span class="input-group-text bg-white border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="q" th:value="${q}" class="form-control border-0 bg-white shadow-none" placeholder="Buscar por número o cliente...">
                        <a th:if="${q != null and q != ''}" href="/cotizaciones" class="btn btn-white border-0 text-danger" title="Limpiar"><i class="bi bi-x-circle-fill"></i></a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Buscar</button>
                    </div>
                </form>

                <a href="/cotizaciones/nueva" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">
                    <i class="bi bi-plus-circle-fill me-2"></i>Nueva Cotización
                </a>
            </div>
            
            <div class="card border-0 shadow-sm overflow-hidden bg-white">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Número</th>
                                <th>Cliente / Proyecto</th>
                                <th>Fechas</th>
                                <th class="text-end">Total</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${cotizaciones}">
                                <td class="ps-4 fw-bold text-primary" th:text="${c.numero != null ? c.numero : 'N/A'}"></td>
                                <td>
                                    <strong class="text-dark d-block" th:text="${c.cliente.nombre}"></strong>
                                    <small class="text-muted" th:text="${c.proyecto != null ? 'Proy: ' + c.proyecto.nombre : 'Sin Proyecto'}"></small>
                                </td>
                                <td>
                                    <small class="d-block text-muted">Emisión: <span class="text-dark fw-bold" th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></span></small>
                                    <small class="d-block text-muted" th:if="${c.fechaValidez != null}">Válida hasta: <span class="text-danger fw-bold" th:text="${#temporals.format(c.fechaValidez, 'dd/MM/yyyy')}"></span></small>
                                </td>
                                <td class="text-end fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(c.total, 1, 2)}"></td>
                                <td class="text-center">
                                    <span th:if="${c.estado == 'Borrador'}" class="badge bg-secondary rounded-pill px-3">Borrador</span>
                                    <span th:if="${c.estado == 'Enviada'}" class="badge bg-info text-dark rounded-pill px-3">Enviada</span>
                                    <span th:if="${c.estado == 'Aprobada'}" class="badge bg-success rounded-pill px-3">Aprobada</span>
                                    <span th:if="${c.estado == 'Rechazada'}" class="badge bg-danger rounded-pill px-3">Rechazada</span>
                                    <span th:if="${c.estado == 'Cerrada'}" class="badge bg-dark rounded-pill px-3">Cerrada</span>
                                </td>
                                <td class="text-center pe-4">
                                    <!-- Editar (Oculto si ya fue aprobada o cerrada) -->
                                    <a th:if="${c.estado != 'Aprobada' and c.estado != 'Cerrada'}" th:href="@{/cotizaciones/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold me-1">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>
                                    <!-- Imprimir PDF -->
                                    <a th:href="@{/cotizaciones/imprimir/{id}(id=${c.id})}" target="_blank" class="btn btn-sm btn-dark rounded-pill px-3 fw-bold shadow-sm">
                                        <i class="bi bi-printer-fill"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(cotizaciones)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-file-earmark-x display-6 d-block mb-2"></i>
                                    No se encontraron cotizaciones.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
