<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cotización')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('cotizaciones')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar(${cotizacion.id == null ? 'Nueva Cotización' : 'Editar Cotización'})}"></header>
        <main class="content-body">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="/cotizaciones" class="btn btn-outline-secondary rounded-pill px-4 fw-bold shadow-sm"><i class="bi bi-arrow-left me-2"></i>Volver</a>
            </div>

            <form th:action="@{/cotizaciones/guardar}" th:object="${cotizacion}" method="post" id="formCotizacion">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{numero}">

                <div class="row g-4">
                    <!-- DATOS GENERALES (MASTER) -->
                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm p-4 h-100">
                            <h6 class="fw-bold text-primary mb-4"><i class="bi bi-card-heading me-2"></i>Datos Generales</h6>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Cliente</label>
                                <select th:field="*{cliente.id}" class="form-select bg-light border-0 fw-bold" required>
                                    <option value="">-- Seleccione Cliente --</option>
                                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Proyecto Vinculado (Opcional)</label>
                                <select th:field="*{proyecto.id}" class="form-select bg-light border-0">
                                    <option value="">-- Ninguno --</option>
                                    <option th:each="p : ${proyectos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                                </select>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold small text-muted">Fecha Emisión</label>
                                    <input type="date" th:field="*{fecha}" class="form-control bg-light border-0" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold small text-muted">Válida Hasta</label>
                                    <input type="date" th:field="*{fechaValidez}" class="form-control bg-light border-0" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">Estado</label>
                                <select th:field="*{estado}" class="form-select bg-light border-0 fw-bold text-secondary" required>
                                    <option value="Borrador">Borrador</option>
                                    <option value="Enviada">Enviada al Cliente</option>
                                    <option value="Aprobada">Aprobada</option>
                                    <option value="Rechazada">Rechazada</option>
                                </select>
                            </div>

                            <!-- Ocultos para que Java atrape los totales calculados en JS -->
                            <input type="hidden" th:field="*{subtotal}" id="hiddenSubtotal">
                            <input type="hidden" th:field="*{iva}" id="hiddenIva">
                            <input type="hidden" th:field="*{total}" id="hiddenTotal">

                            <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold shadow-sm py-2">
                                <i class="bi bi-save-fill me-2"></i>Guardar Cotización
                            </button>
                        </div>
                    </div>

                    <!-- DETALLES Y TOTALES (DETAIL) -->
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm overflow-hidden h-100">
                            <div class="card-header bg-white border-bottom p-4 d-flex justify-content-between align-items-center">
                                <h6 class="fw-bold mb-0 text-primary"><i class="bi bi-list-columns-reverse me-2"></i>Detalle de Servicios / Productos</h6>
                                <button type="button" id="btnAgregarFila" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold shadow-sm">
                                    <i class="bi bi-plus-lg me-1"></i> Agregar Fila
                                </button>
                            </div>
                            <div class="card-body p-0 table-responsive">
                                <table class="table align-middle mb-0" id="tablaDetalles">
                                    <thead class="table-light small text-muted">
                                        <tr>
                                            <th class="ps-4" style="width: 45%;">Descripción</th>
                                            <th style="width: 15%;">Cant.</th>
                                            <th style="width: 20%;">P. Unitario ($)</th>
                                            <th style="width: 15%;" class="text-end">Subtotal</th>
                                            <th style="width: 5%;" class="text-center"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="filasContenedor">
                                        <!-- FILAS EXISTENTES (Al editar) -->
                                        <tr th:each="d, stat : *{detalles}" class="fila-detalle">
                                            <td class="ps-4">
                                                <input type="text" th:name="|detalles[${stat.index}].descripcion|" th:value="${d.descripcion}" class="form-control border-0 bg-light" required>
                                            </td>
                                            <td>
                                                <input type="number" step="0.01" min="0" th:name="|detalles[${stat.index}].cantidad|" th:value="${d.cantidad}" class="form-control border-0 bg-light val-cant" required>
                                            </td>
                                            <td>
                                                <input type="number" step="0.01" min="0" th:name="|detalles[${stat.index}].precioUnitario|" th:value="${d.precioUnitario}" class="form-control border-0 bg-light val-precio" required>
                                            </td>
                                            <td class="text-end fw-bold text-secondary subtotal-fila" th:text="${'$' + #numbers.formatDecimal(d.subtotal, 1, 2)}">$0.00</td>
                                            <!-- Guardamos el subtotal en un hidden real para Java -->
                                            <input type="hidden" th:name="|detalles[${stat.index}].subtotal|" th:value="${d.subtotal}" class="hidden-subtotal">
                                            <td class="text-center pe-3"><button type="button" class="btn btn-link text-danger btn-eliminar-fila p-0"><i class="bi bi-trash-fill fs-5"></i></button></td>
                                        </tr>
                                        <!-- SI ESTÁ VACÍO (Nueva cotización), JS agregará una fila inicial automáticamente -->
                                    </tbody>
                                    <tfoot class="table-light">
                                        <tr>
                                            <td colspan="3" class="text-end fw-bold text-muted pt-4">Subtotal:</td>
                                            <td class="text-end fw-bold text-dark pt-4" id="lblSubtotal">$0.00</td>
                                            <td></td>
                                        </tr>
                                        <tr>
                                            <td colspan="3" class="text-end fw-bold text-muted border-0">IVA (13%):</td>
                                            <td class="text-end fw-bold text-danger border-0" id="lblIva">$0.00</td>
                                            <td class="border-0"></td>
                                        </tr>
                                        <tr>
                                            <td colspan="3" class="text-end fw-bold text-primary fs-5 border-0 pb-4">TOTAL:</td>
                                            <td class="text-end fw-bold text-primary fs-5 border-0 pb-4" id="lblTotal">$0.00</td>
                                            <td class="border-0"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    
    <!-- LÓGICA DE JAVASCRIPT PARA EL FORMULARIO DINÁMICO MAESTRO-DETALLE -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const btnAgregar = document.getElementById('btnAgregarFila');
            const contenedor = document.getElementById('filasContenedor');
            let indexFila = contenedor.querySelectorAll('tr').length; // Saber en qué índice vamos

            // Si es nueva y no tiene filas, agregamos la primera por defecto
            if (indexFila === 0) agregarFila();

            // Evento Click para agregar nueva fila
            btnAgregar.addEventListener('click', agregarFila);

            // Escuchar cambios en todo el contenedor (Delegación de eventos para Inputs y Botones de Borrar)
            contenedor.addEventListener('input', calcularTotales);
            contenedor.addEventListener('click', function(e) {
                if (e.target.closest('.btn-eliminar-fila')) {
                    e.target.closest('tr').remove();
                    // Reindexar nombres para que Spring Boot no se confunda
                    reindexarFilas();
                    calcularTotales();
                }
            });

            // Función para inyectar un nuevo <tr>
            function agregarFila() {
                const tr = document.createElement('tr');
                tr.className = 'fila-detalle';
                tr.innerHTML = `
                    <td class="ps-4">
                        <input type="text" name="detalles[${indexFila}].descripcion" class="form-control border-0 bg-light" placeholder="Ej: Bolsa de Cemento" required>
                    </td>
                    <td>
                        <input type="number" step="0.01" min="0" name="detalles[${indexFila}].cantidad" class="form-control border-0 bg-light val-cant" value="1" required>
                    </td>
                    <td>
                        <input type="number" step="0.01" min="0" name="detalles[${indexFila}].precioUnitario" class="form-control border-0 bg-light val-precio" value="0.00" required>
                    </td>
                    <td class="text-end fw-bold text-secondary subtotal-fila">$0.00</td>
                    <input type="hidden" name="detalles[${indexFila}].subtotal" class="hidden-subtotal" value="0.00">
                    <td class="text-center pe-3"><button type="button" class="btn btn-link text-danger btn-eliminar-fila p-0"><i class="bi bi-trash-fill fs-5"></i></button></td>
                `;
                contenedor.appendChild(tr);
                indexFila++;
                calcularTotales();
            }

            // Arregla los índices si el usuario borra una fila del medio
            function reindexarFilas() {
                const filas = contenedor.querySelectorAll('tr');
                filas.forEach((fila, i) => {
                    fila.querySelector('input[name$=".descripcion"]').name = `detalles[${i}].descripcion`;
                    fila.querySelector('input[name$=".cantidad"]').name = `detalles[${i}].cantidad`;
                    fila.querySelector('input[name$=".precioUnitario"]').name = `detalles[${i}].precioUnitario`;
                    fila.querySelector('input[name$=".subtotal"]').name = `detalles[${i}].subtotal`;
                });
                indexFila = filas.length;
            }

            // El corazón matemático: Subtotal, IVA 13% y Total Final
            function calcularTotales() {
                let subtotalGlobal = 0.0;

                contenedor.querySelectorAll('tr').forEach(fila => {
                    let cant = parseFloat(fila.querySelector('.val-cant').value) || 0;
                    let precio = parseFloat(fila.querySelector('.val-precio').value) || 0;
                    let sub = cant * precio;
                    
                    fila.querySelector('.subtotal-fila').innerText = '$' + sub.toFixed(2);
                    fila.querySelector('.hidden-subtotal').value = sub.toFixed(2);
                    subtotalGlobal += sub;
                });

                let iva = subtotalGlobal * 0.13; // 13% El Salvador
                let total = subtotalGlobal + iva;

                // Mostrar en pantalla
                document.getElementById('lblSubtotal').innerText = '$' + subtotalGlobal.toFixed(2);
                document.getElementById('lblIva').innerText = '$' + iva.toFixed(2);
                document.getElementById('lblTotal').innerText = '$' + total.toFixed(2);

                // Guardar en hiddens para la base de datos
                document.getElementById('hiddenSubtotal').value = subtotalGlobal.toFixed(2);
                document.getElementById('hiddenIva').value = iva.toFixed(2);
                document.getElementById('hiddenTotal').value = total.toFixed(2);
            }

            // Calcular al iniciar por si estamos en modo Edición
            calcularTotales();
        });
    </script>
</body>
</html>
