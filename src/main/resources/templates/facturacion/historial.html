<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historial de Facturación')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('facturacion')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Archivos de Integración (Llama)')}"></header>
        <main class="content-body">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Historial de Exportaciones</h4>
                <a href="/facturacion/generar" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                    <i class="bi bi-file-earmark-plus-fill me-2"></i>Nueva Exportación
                </a>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden bg-white">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID Archivo</th>
                                <th>Cliente</th>
                                <th>Rango Facturado</th>
                                <th>Formato</th>
                                <th class="text-center pe-4">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${archivos}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-2">
                                        <i th:if="${a.formato == 'EXCEL'}" class="bi bi-file-earmark-excel-fill text-success fs-3"></i>
                                        <i th:if="${a.formato == 'JSON'}" class="bi bi-filetype-json text-warning fs-3"></i>
                                        <div>
                                            <span class="fw-bold text-dark d-block" th:text="${a.archivoUrl}"></span>
                                            <small class="text-muted" th:text="'Generado: ' + ${#temporals.format(a.fechaGeneracion, 'dd/MM/yyyy HH:mm')} + ' por ' + ${a.generadoPor}"></small>
                                        </div>
                                    </div>
                                </td>
                                <td class="fw-bold text-primary" th:text="${a.cliente.nombre}"></td>
                                <td>
                                    <span class="d-block small text-muted" th:text="'De: ' + ${#temporals.format(a.rangoInicio, 'dd/MM/yyyy')}"></span>
                                    <span class="d-block small text-muted" th:text="'A: ' + ${#temporals.format(a.rangoFin, 'dd/MM/yyyy')}"></span>
                                </td>
                                <td><span class="badge bg-light text-dark border px-3" th:text="${a.formato}"></span></td>
                                <td class="text-center pe-4">
                                    <!-- HU-19 Tarea 2: Botón para descargar nuevamente el archivo si aún existe -->
                                    <a th:href="@{'/uploads/' + ${a.archivoUrl}}" download class="btn btn-sm btn-dark rounded-pill px-4 fw-bold shadow-sm">
                                        <i class="bi bi-download me-1"></i> Descargar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(archivos)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="bi bi-cloud-arrow-down display-4 d-block mb-3 opacity-50"></i>
                                    Aún no se han exportado archivos al sistema Llama.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
