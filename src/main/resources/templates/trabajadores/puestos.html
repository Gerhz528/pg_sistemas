<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Puestos de Trabajo')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('trabajadores')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Configurar Puestos')}"></header>
        <main class="content-body">
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="/trabajadores" class="btn btn-outline-secondary rounded-pill px-4 fw-bold shadow-sm"><i class="bi bi-arrow-left me-2"></i>Volver</a>
                <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoPuesto">
                    <i class="bi bi-plus-lg me-2"></i>Agregar Puesto
                </button>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light"><tr><th class="ps-4">ID</th><th>Nombre del Puesto</th><th>Salario Base (Hora)</th></tr></thead>
                                <tbody>
                                    <tr th:each="p : ${puestos}">
                                        <td class="ps-4 text-muted small" th:text="${p.id}"></td>
                                        <td th:text="${p.nombre}" class="fw-bold text-dark"></td>
                                        <td class="text-success fw-bold" th:text="'$' + ${#numbers.formatDecimal(p.salarioPorHora, 1, 2)}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Nuevo Puesto -->
            <div class="modal fade" id="modalNuevoPuesto" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content border-0 shadow">
                        <form th:action="@{/trabajadores/puestos/guardar}" th:object="${nuevoPuesto}" method="post">
                            <div class="modal-header bg-dark text-white border-0">
                                <h5 class="modal-title fw-bold">Nuevo Cargo</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Nombre del Cargo</label>
                                    <input type="text" th:field="*{nombre}" class="form-control bg-light border-0" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Salario por Hora ($)</label>
                                    <input type="number" step="0.01" th:field="*{salarioPorHora}" class="form-control bg-light border-0" value="0.00" required>
                                </div>
                            </div>
                            <div class="modal-footer border-0 bg-light">
                                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Registrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
