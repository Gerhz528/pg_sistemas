<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proyectos')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('proyectos')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Gestión de Proyectos')}"></header>
        <main class="content-body">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4" th:text="${error}"></div>

            <!-- CONTROLES SUPERIORES Y BUSCADOR -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <form action="/proyectos" method="get" class="flex-grow-1" style="max-width: 500px;">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border">
                        <span class="input-group-text bg-white border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="q" th:value="${q}" class="form-control border-0 bg-white shadow-none" placeholder="Buscar por nombre o cliente...">
                        <a th:if="${q != null and q != ''}" href="/proyectos" class="btn btn-white border-0 text-danger d-flex align-items-center" title="Limpiar búsqueda"><i class="bi bi-x-circle-fill"></i></a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Buscar</button>
                    </div>
                </form>

                <button class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCrearProyecto">
                    <i class="bi bi-building-add me-2"></i>Crear Proyecto
                </button>
            </div>
            
            <div class="card border-0 shadow-sm overflow-hidden bg-white">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Proyecto</th>
                                <th>Cliente</th>
                                <th>Cronograma</th>
                                <th>Costo Acumulado</th>
                                <th>Estado</th>
                                <th class="text-center pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${proyectos}">
                                <td class="ps-4">
                                    <strong class="text-dark d-block" th:text="${p.nombre}"></strong>
                                    <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;" th:text="${p.descripcion}"></small>
                                </td>
                                <td>
                                    <span class="fw-semibold text-primary"><i class="bi bi-person-badge me-1"></i>[[${p.cliente.nombre}]]</span>
                                </td>
                                <td>
                                    <!-- ENLACE MEJORADO: Redirige a facturas y previene Error 500 si es null -->
                                    <a th:href="@{/facturas(q=${p.nombre})}" class="text-decoration-none text-danger fw-bold fs-6 shadow-sm px-2 py-1 rounded bg-danger bg-opacity-10" title="Ver desglose de facturas">
                                        <i class="bi bi-graph-down-arrow me-1"></i>
                                        $<span th:text="${gastos.get(p.id) != null ? #numbers.formatDecimal(gastos.get(p.id), 1, 2) : '0.00'}"></span>
                                    </a>
                                </td>
                                <td>
                                    <small class="d-block text-muted"><i class="bi bi-calendar-event me-1"></i>Inicio: <strong class="text-dark" th:text="${#temporals.format(p.fechaInicio, 'dd/MM/yyyy')}"></strong></small>
                                    <small class="d-block text-muted" th:if="${p.fechaFin != null}"><i class="bi bi-calendar-check me-1"></i>Fin: <strong class="text-dark" th:text="${#temporals.format(p.fechaFin, 'dd/MM/yyyy')}"></strong></small>
                                </td>
                                <td>
                                    <span th:if="${p.estado == 'Planificado'}" class="badge bg-secondary rounded-pill px-3">Planificado</span>
                                    <span th:if="${p.estado == 'En Curso'}" class="badge bg-primary rounded-pill px-3">En Curso</span>
                                    <span th:if="${p.estado == 'Completado'}" class="badge bg-success rounded-pill px-3">Completado</span>
                                    <span th:if="${p.estado == 'Pausado'}" class="badge bg-warning text-dark rounded-pill px-3">Pausado</span>
                                </td>
                                <td class="text-center pe-4">
                                    
                                    <div class="btn-group shadow-sm">
                                        <!-- BOTÓN MAGICO AL GANTT -->
                                        <a th:href="@{/proyectos/{id}/gantt(id=${p.id})}" class="btn btn-sm btn-dark px-3 fw-bold" title="Abrir Programación (Gantt)">
                                            <i class="bi bi-bar-chart-steps me-1"></i>Gantt
                                        </a>
                                        <!-- Botón Editar normal -->
                                        <button class="btn btn-sm btn-outline-primary px-3 fw-bold" data-bs-toggle="modal" th:data-bs-target="'#modalEditarProyecto-' + ${p.id}" title="Ajustes">
                                            <i class="bi bi-gear-fill"></i>
                                        </button>
                                    </div>

                                    <!-- Modal Editar Proyecto -->
                                    <div class="modal fade text-start" th:id="'modalEditarProyecto-' + ${p.id}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered modal-lg">
                                            <div class="modal-content border-0 shadow">
                                                <form th:action="@{/proyectos/guardar}" method="post">
                                                    <input type="hidden" name="id" th:value="${p.id}">
                                                    <div class="modal-header bg-warning border-0">
                                                        <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Editar Proyecto</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body p-4">
                                                        <div class="row g-3 mb-3">
                                                            <div class="col-md-8">
                                                                <label class="form-label fw-bold small text-muted">Nombre de la Obra / Proyecto</label>
                                                                <input type="text" name="nombre" class="form-control bg-light border-0 fw-bold" th:value="${p.nombre}" required>
                                                            </div>
                                                            <div class="col-md-4">
                                                                <label class="form-label fw-bold small text-muted">Estado del Proyecto</label>
                                                                <select name="estado" class="form-select bg-light border-0 fw-bold" required>
                                                                    <option value="Planificado" th:selected="${p.estado == 'Planificado'}">Planificado</option>
                                                                    <option value="En Curso" th:selected="${p.estado == 'En Curso'}">En Curso</option>
                                                                    <option value="Pausado" th:selected="${p.estado == 'Pausado'}">Pausado</option>
                                                                    <option value="Completado" th:selected="${p.estado == 'Completado'}">Completado</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        
                                                        <div class="mb-3">
                                                            <label class="form-label fw-bold small text-muted">Cliente Propietario</label>
                                                            <select name="cliente.id" class="form-select bg-light border-0" required>
                                                                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre} + ' (DUI: ' + ${c.dui} + ')'" th:selected="${p.cliente.id == c.id}"></option>
                                                            </select>
                                                        </div>

                                                        <div class="row g-3 mb-3">
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">Fecha de Inicio</label>
                                                                <input type="date" name="fechaInicio" class="form-control bg-light border-0" th:value="${p.fechaInicio}" required>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">Fecha Estimada de Fin</label>
                                                                <input type="date" name="fechaFin" class="form-control bg-light border-0" th:value="${p.fechaFin}">
                                                            </div>
                                                        </div>
                                                        <div class="mb-2">
                                                            <label class="form-label fw-bold small text-muted">Descripción o Detalles Generales</label>
                                                            <textarea name="descripcion" class="form-control bg-light border-0" rows="3" th:text="${p.descripcion}"></textarea>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer border-0 bg-light">
                                                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                                                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Guardar Cambios</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(proyectos)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-buildings display-6 d-block mb-2"></i>
                                    <span th:if="${q == null}">Aún no hay proyectos registrados en el sistema.</span>
                                    <span th:if="${q != null}">No se encontraron resultados para "<span th:text="${q}"></span>"</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Crear Proyecto -->
            <div class="modal fade" id="modalCrearProyecto" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content border-0 shadow">
                        <form th:action="@{/proyectos/guardar}" th:object="${nuevoProyecto}" method="post">
                            <div class="modal-header bg-success text-white border-0">
                                <h5 class="modal-title fw-bold"><i class="bi bi-building-add me-2"></i>Registrar Nuevo Proyecto</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-muted">Nombre de la Obra / Proyecto</label>
                                    <input type="text" th:field="*{nombre}" class="form-control bg-light border-0" placeholder="Ej: Residencial Las Luces - Etapa 2" required>
                                </div>
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between">
                                        <label class="form-label fw-bold small text-muted">Cliente Propietario</label>
                                        <a href="/clientes" class="small text-decoration-none text-primary fw-bold">+ Nuevo Cliente</a>
                                    </div>
                                    <select th:field="*{cliente.id}" class="form-select bg-light border-0" required>
                                        <option value="">-- Seleccione un Cliente --</option>
                                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre} + ' (DUI: ' + ${c.dui} + ')'"></option>
                                    </select>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Fecha de Inicio</label>
                                        <input type="date" th:field="*{fechaInicio}" class="form-control bg-light border-0" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Fecha Estimada de Fin (Opcional)</label>
                                        <input type="date" th:field="*{fechaFin}" class="form-control bg-light border-0">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label fw-bold small text-muted">Descripción General</label>
                                    <textarea th:field="*{descripcion}" class="form-control bg-light border-0" rows="3" placeholder="Detalles de ubicación, requerimientos técnicos, etc."></textarea>
                                </div>
                            </div>
                            <div class="modal-footer border-0 bg-light">
                                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">Crear Proyecto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>
    
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
