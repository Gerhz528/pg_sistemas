<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container text-center">
        <div class="card shadow p-5 border-danger">
            <h1 class="display-1 text-danger">403</h1>
            <h2>Acceso Denegado</h2>
            <p class="lead">No tienes permisos para acceder a esta sección del sistema.</p>
            <hr>
            <div class="d-flex justify-content-center gap-3">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger">Cerrar Sesión</button>
                </form>
                <a href="/usuarios" class="btn btn-primary">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
