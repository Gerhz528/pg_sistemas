<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historial de Herramienta')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('inventario')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Auditoría de Bodega')}"></header>
        <main class="content-body">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a href="/inventario" class="btn btn-outline-secondary rounded-pill px-4 fw-bold shadow-sm"><i class="bi bi-arrow-left me-2"></i>Volver al Catálogo</a>
            </div>

            <div class="row g-4">
                <!-- RESUMEN DE LA HERRAMIENTA -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm overflow-hidden h-100">
                        <div style="height: 250px; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                            <img th:if="${herramienta.imagen != null}" th:src="@{'/uploads/' + ${herramienta.imagen}}" style="width: 100%; height: 100%; object-fit: cover;">
                            <i th:unless="${herramienta.imagen != null}" class="bi bi-wrench-adjustable text-secondary opacity-50" style="font-size: 7rem;"></i>
                        </div>
                        <div class="card-body p-4 text-center">
                            <h4 class="fw-bold text-dark mb-1" th:text="${herramienta.nombre}"></h4>
                            <p class="font-monospace text-muted mb-4"><i class="bi bi-upc-scan me-2"></i><span th:text="${herramienta.codigo}"></span></p>

                            <div class="d-flex justify-content-center gap-3 mb-4">
                                <div class="p-3 bg-light rounded-4 w-50">
                                    <h2 class="fw-bold text-primary mb-0" th:text="${herramienta.stock}"></h2>
                                    <small class="text-muted fw-bold text-uppercase">Bodega</small>
                                </div>
                                <div class="p-3 border rounded-4 w-50">
                                    <h3 class="fw-bold text-secondary mb-0" th:text="${herramienta.stockMinimo}"></h3>
                                    <small class="text-muted fw-bold text-uppercase">Mínimo</small>
                                </div>
                            </div>

                            <div class="text-start">
                                <p class="mb-1 text-muted small"><strong>Marca:</strong> <span th:text="${herramienta.marca != null and herramienta.marca != '' ? herramienta.marca : 'N/A'}"></span></p>
                                <p class="mb-0 text-muted small"><strong>Estado:</strong> <span th:text="${herramienta.condicion}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TABLA HISTÓRICA (KARDEX) -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-header bg-white border-bottom p-4">
                            <h5 class="fw-bold text-dark mb-0"><i class="bi bi-clock-history text-primary me-2"></i>Historial de Movimientos</h5>
                        </div>
                        <div class="card-body p-0 table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light small text-muted text-uppercase">
                                    <tr>
                                        <th class="ps-4">Fecha</th>
                                        <th>Acción</th>
                                        <th class="text-center">Cant.</th>
                                        <th>Proyecto (Destino/Origen)</th>
                                        <th>Responsable</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${historial}">
                                        <td class="ps-4 text-muted font-monospace small" th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy')}"></td>
                                        
                                        <!-- Etiqueta Visual de Entrada / Salida -->
                                        <td>
                                            <span th:if="${m.tipo == 'ASIGNACION'}" class="badge bg-danger-subtle text-danger border border-danger rounded-pill px-3 shadow-sm"><i class="bi bi-box-arrow-up-right me-1"></i>Salida (Prestado)</span>
                                            <span th:if="${m.tipo == 'DEVOLUCION'}" class="badge bg-success-subtle text-success border border-success rounded-pill px-3 shadow-sm"><i class="bi bi-box-arrow-in-down-left me-1"></i>Entrada (Devuelto)</span>
                                        </td>
                                        
                                        <td class="text-center fw-bold fs-6">
                                            <span th:if="${m.tipo == 'ASIGNACION'}" class="text-danger" th:text="'-' + ${m.cantidad}"></span>
                                            <span th:if="${m.tipo == 'DEVOLUCION'}" class="text-success" th:text="'+' + ${m.cantidad}"></span>
                                        </td>

                                        <td>
                                            <span class="fw-bold text-dark d-block" th:text="${m.proyecto != null ? m.proyecto.nombre : 'General'}"></span>
                                        </td>
                                        
                                        <td>
                                            <span class="d-block text-muted small"><i class="bi bi-person-fill me-1"></i><span th:text="${m.responsable}"></span></span>
                                            <span class="d-block text-muted small" style="font-size: 0.7rem;"><i class="bi bi-shield-check me-1"></i>Aprobado por: <strong th:text="${m.registradoPor != null ? m.registradoPor.username : 'Sistema'}"></strong></span>
                                        </td>
                                    </tr>

                                    <tr th:if="${#lists.isEmpty(historial)}">
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <i class="bi bi-clipboard-x display-6 d-block mb-3 opacity-50"></i>
                                            Esta herramienta aún no tiene registros de entradas o salidas.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
